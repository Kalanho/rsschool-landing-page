<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог — Family Crafto</title>
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/theme.js" defer></script>
</head>
<body>

    <header class="header">
        <div class="container header__inner">
            <a href="index.html" class="logo">Family Crafto</a>

            <nav class="nav" aria-label="Основная навигация">
                <ul class="nav__list">
                    <li><a href="index.html#hero">Главная</a></li>
                    <li><a href="index.html#products">Изделия</a></li>
                    <li><a href="index.html#benefits">О нас</a></li>
                    <li><a href="index.html#engraving">Гравировка</a></li>
                    <li><a href="catalog.html">Каталог</a></li>
                </ul>
            </nav>

            <button class="theme-toggle" type="button" aria-label="Переключить тему">
                <span class="theme-toggle__icon theme-toggle__icon--sun" aria-hidden="true">☀️</span>
                <span class="theme-toggle__icon theme-toggle__icon--moon" aria-hidden="true">🌙</span>
            </button>

            <button class="burger" type="button" aria-label="Открыть меню">
                <span></span><span></span><span></span>
            </button>
        </div>
    </header>

    <main class="catalog">
        <div class="container">
            <h1>Каталог</h1>
            <p class="catalog__subtitle">Кожаные изделия ручной работы — ремни, сумки, кошельки, аксессуары</p>

            <div class="categories" role="tablist" aria-label="Категории товаров">
                <button class="category category--active" type="button" data-category="belts">Ремни</button>
                <button class="category" type="button" data-category="bags">Сумки</button>
                <button class="category" type="button" data-category="wallets">Кошельки</button>
                <button class="category" type="button" data-category="accessories">Аксессуары</button>
            </div>

            <ul class="products" id="products"></ul>

            <div class="catalog__more">
                <button class="btn btn--outline" id="show-more" type="button">Показать ещё</button>
            </div>
        </div>
    </main>

    <!-- Модальное окно -->
    <div class="modal" id="modal" hidden>
        <div class="modal__overlay" data-close></div>
        <div class="modal__content" role="dialog" aria-modal="true" aria-label="Информация о товаре"></div>
    </div>

    <footer class="footer">
        <div class="container footer__inner">
            <div class="footer__col">
                <h3>Контакты</h3>
                <a href="mailto:info@familycrafto.by">info@familycrafto.by</a>
            </div>

            <div class="footer__col">
                <h3>Мы в сети</h3>
                <a href="https://t.me/family_crafto" target="_blank" rel="noopener">Telegram</a>
                <a href="https://wa.me/375291234567" target="_blank" rel="noopener">WhatsApp</a>
            </div>

            <div class="footer__col">
                <p>© 2026 Family Crafto</p>
                <a href="https://rs.school/js/" target="_blank" rel="noopener">RS School</a>
                <a href="https://github.com/Kalanho" target="_blank" rel="noopener" class="footer__link">GitHub</a>
            </div>
        </div>
    </footer>

    <script src="js/burger.js"></script>
    <script type="module" src="js/catalog.js"></script>
    <script type="module" src="js/modal.js"></script>
</body>
</html>
